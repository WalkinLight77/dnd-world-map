<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>D&D World Map</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: #111;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        #toolbar {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;

            background: rgba(20, 20, 20, 0.92);
            color: white;

            padding: 10px;
            border-radius: 8px;

            display: flex;
            gap: 8px;
            align-items: center;

            box-shadow: 0 2px 8px rgba(0,0,0,.5);
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }

        #status {
            min-width: 220px;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            #toolbar {
                width: 90%;
                flex-wrap: wrap;
                justify-content: center;
            }

            #status {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div id="toolbar">
    <button id="calibrateButton" style="display:none;">Calibrate 50 Miles</button>
    <button id="measureButton">Measure</button>
    <button id="clearButton">Clear</button>

    <span id="status">Loading ...</span>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const IMAGE_URL = "Map.jpg";
const CALIBRATION_MILES = 50;

const map = L.map("map", {
    crs: L.CRS.Simple,
    minZoom: -5,
    maxZoom: 1,
    zoomSnap: 0.25,
    doubleClickZoom: false
});

let mode = "none";

let pixelsPerMile = 1.5202795795510793;


// ======================================
// CALIBRATION
// ======================================

let calibrationPoints = [];
let calibrationLayers = [];


// ======================================
// ROUTES
// ======================================

// Every completed/visible route stays here.
let savedRouteLayers = [];

// Route currently being built.
let currentRoute = null;

// Temporary line following the mouse.
let previewLine = null;

// Temporary live distance label.
let previewTooltip = null;

// Helps separate single-click from double-click.
let clickTimer = null;
let mouseIsDown = false;
let mouseDownPoint = null;
let mouseDragged = false;

const CLICK_DRAG_TOLERANCE = 6;

// ======================================
// UI
// ======================================

const statusText =
    document.getElementById("status");

const measureButton =
    document.getElementById("measureButton");


// ======================================
// LOAD IMAGE
// ======================================

const image = new Image();

image.onload = function () {

    const width = image.naturalWidth;
    const height = image.naturalHeight;

    const bounds = [
        [0, 0],
        [height, width]
    ];

    L.imageOverlay(
        IMAGE_URL,
        bounds
    ).addTo(map);

    map.fitBounds(bounds);
    
    const fitZoom = map.getBoundsZoom(bounds);

    map.setMinZoom(fitZoom);

    map.setMaxBounds([
        [-height * 0.2, -width * 0.2],
        [height * 1.2, width * 1.2]
    ]);

    updateStatus();
};

image.onerror = function () {

    statusText.innerText =
        "Map image could not be loaded.";
};

image.src = IMAGE_URL;


// ======================================
// DISTANCE FUNCTIONS
// ======================================

function pixelDistance(a, b) {

    const dx = b.lng - a.lng;
    const dy = b.lat - a.lat;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


function milesBetween(a, b) {

    if (!pixelsPerMile) {
        return 0;
    }

    return pixelDistance(a, b) / pixelsPerMile;
}


// ======================================
// STATUS
// ======================================

function updateStatus() {

    if (pixelsPerMile) {

        statusText.innerText =
            "Ready.";

    } else {

        statusText.innerText =
            "Calibrate the map before measuring.";
    }
}


// ======================================
// REMOVE PREVIEW ONLY
// ======================================

function removePreview() {

    if (previewLine) {

        if (map.hasLayer(previewLine)) {
            map.removeLayer(previewLine);
        }

        previewLine = null;
    }


    if (previewTooltip) {

        if (map.hasLayer(previewTooltip)) {
            map.removeLayer(previewTooltip);
        }

        previewTooltip = null;
    }
}


// ======================================
// CALIBRATION CLEANUP
// ======================================

function clearCalibrationMarks() {

    calibrationLayers.forEach(layer => {

        if (map.hasLayer(layer)) {
            map.removeLayer(layer);
        }

    });

    calibrationLayers = [];
    calibrationPoints = [];
}


// ======================================
// ROUTE CREATION
// ======================================

function startRoute(point) {

    const startMarker =
        L.circleMarker(point, {
            radius: 5,
            weight: 2,
            color: "#ff2b2b",
            fillColor: "#ff2b2b",
            fillOpacity: 1
        })
        .addTo(map);


    savedRouteLayers.push(
        startMarker
    );


    currentRoute = {

        points: [point],

        totalMiles: 0,

        lastPoint: point,

        layers: [
            startMarker
        ]
    };


    statusText.innerText =
        "Route started — move mouse and click to place the next point.";
}


// ======================================
// LOCK A STRAIGHT SEGMENT
// ======================================

function addWaypoint(point) {

    if (!currentRoute) {
        startRoute(point);
        return;
    }


    const previousPoint =
        currentRoute.lastPoint;


    const segmentMiles =
        milesBetween(
            previousPoint,
            point
        );


    currentRoute.totalMiles +=
        segmentMiles;


    // Permanent straight segment
    const line =
        L.polyline(
            [
                previousPoint,
                point
            ],
            {
                weight: 3,
                color: "#ff2b2b",
                dashArray: "3, 6",
                lineCap: "round"
            }
        )
        .addTo(map);


    savedRouteLayers.push(line);
    currentRoute.layers.push(line);


    // Waypoint dot
    const marker =
        L.circleMarker(point, {
            radius: 4,
            weight: 2,
            color: "#ff2b2b",
            fillColor: "#ff2b2b",
            fillOpacity: 1
        })
        .addTo(map);


    savedRouteLayers.push(marker);
    currentRoute.layers.push(marker);


    // CUMULATIVE distance label
    const label =
        L.tooltip({
            permanent: true,
            direction: "top",
            offset: [0, -9],
            className: "distance-label"
        })
        .setLatLng(point)
        .setContent(
            Math.round(
                currentRoute.totalMiles
            ) +
            " miles"
        )
        .addTo(map);


    savedRouteLayers.push(label);
    currentRoute.layers.push(label);


    currentRoute.points.push(point);

    currentRoute.lastPoint =
        point;


    removePreview();


    statusText.innerText =
        "Total: " +
        currentRoute.totalMiles.toFixed(1) +
        " miles";
}


// ======================================
// FINISH ONE ROUTE
// ======================================

function finishRoute() {

    if (!currentRoute) {
        return;
    }


    removePreview();


    const total =
        currentRoute.totalMiles;


    currentRoute = null;


    statusText.innerText =
        "Route finished — " +
        total.toFixed(1) +
        " miles. Click elsewhere to start another.";
}


// ======================================
// CLEAR ALL ROUTES
// ======================================

function clearAllRoutes() {

    removePreview();

    savedRouteLayers.forEach(layer => {

        if (map.hasLayer(layer)) {
            map.removeLayer(layer);
        }

    });

    savedRouteLayers = [];

    currentRoute = null;
}


// ======================================
// CALIBRATION BUTTON
// ======================================

document
.getElementById("calibrateButton")
.addEventListener("click", function () {

    finishRoute();

    clearCalibrationMarks();

    mode = "calibrate";

    measureButton.innerText =
        "Measure";

    statusText.innerText =
        "Click two points exactly 50 miles apart.";
});


// ======================================
// MEASURE BUTTON
// ======================================
    
measureButton.addEventListener("click", function () {

    if (!pixelsPerMile) {

        statusText.innerText =
            "Calibrate the map first.";

        return;
    }


    // If Measure mode is already ON,
    // clicking the button turns it OFF.
    if (mode === "measure") {

        finishRoute();

        mode = "none";

        // Normal map dragging comes back.
        map.dragging.enable();

        measureButton.innerText =
            "Measure";

        statusText.innerText =
            "Measure tool closed. Existing routes remain.";

        return;
    }


    // Turn Measure mode ON.
    clearCalibrationMarks();

mode = "measure";

map.getContainer().classList.add("measure-mode");

measureButton.innerText =
    "Exit Measure";

statusText.innerText =
    "Click anywhere to begin a route.";
});

    
// ======================================
// CLEAR BUTTON
// ======================================

document
.getElementById("clearButton")
.addEventListener("click", function () {

    clearAllRoutes();
    clearCalibrationMarks();

    mode = "none";

    

    measureButton.innerText =
        "Measure";

    updateStatus();
});


// ======================================
// MOUSE DOWN
// ======================================

map.on("mousedown", function (event) {

    if (mode !== "measure") {
        return;
    }

    // Only care about left mouse button
    if (
        event.originalEvent &&
        event.originalEvent.button !== 0
    ) {
        return;
    }

    mouseIsDown = true;
    mouseDragged = false;

    mouseDownPoint =
        map.latLngToContainerPoint(
            event.latlng
        );
});


// ======================================
// DOUBLE CLICK = FINISH ROUTE
// ======================================

map.on("dblclick", function () {

    if (mode !== "measure") {
        return;
    }


    clearTimeout(clickTimer);

    finishRoute();
});

    
// ======================================
// MOUSE MOVE
// ======================================

map.on("mousemove", function (event) {

    if (mode !== "measure") {
        return;
    }


    /*
        If the player is HOLDING the mouse,
        we are checking whether they're dragging.

        We DO NOT draw the measuring preview
        while the button is held.
    */

    if (mouseIsDown) {

        const currentMousePoint =
            map.latLngToContainerPoint(
                event.latlng
            );


        if (
            mouseDownPoint &&
            mouseDownPoint.distanceTo(
                currentMousePoint
            ) > CLICK_DRAG_TOLERANCE
        ) {

            mouseDragged = true;
        }


        return;
    }


    /*
        No route yet.

        Nothing to preview until
        the first point has been clicked.
    */

    if (!currentRoute) {
        return;
    }


    removePreview();


    const cursorPoint =
        event.latlng;


    /*
        Straight-line distance from
        LAST LOCKED POINT to cursor.
    */

    const segmentMiles =
        milesBetween(
            currentRoute.lastPoint,
            cursorPoint
        );


    /*
        Add the previous route distance.

        Example:

        Previous total = 246
        Cursor is currently 80 miles away

        Live total = 326
    */

    const liveTotal =
        currentRoute.totalMiles +
        segmentMiles;


    /*
        ONE straight preview line.

        It is temporary.

        It does NOT become permanent
        until the player clicks.
    */

    previewLine =
        L.polyline(
            [
                currentRoute.lastPoint,
                cursorPoint
            ],
            {
                weight: 3,
                color: "#ff2b2b",
                dashArray: "3, 6",
                lineCap: "round"
            }
        )
        .addTo(map);


    /*
        Live mileage follows the cursor.
    */

    previewTooltip =
        L.tooltip({
            direction: "top",
            offset: [0, -10],
            opacity: 0.95
        })
        .setLatLng(
            cursorPoint
        )
        .setContent(
            "<b>" +
            liveTotal.toFixed(1) +
            " miles</b>"
        )
        .addTo(map);


    statusText.innerText =
        "Total Distance: " +
        liveTotal.toFixed(1) +
        " miles";
});


// ======================================
// MOUSE UP
// ======================================

map.on("mouseup", function (event) {

    if (mode !== "measure") {
        return;
    }


    if (!mouseIsDown) {
        return;
    }


    mouseIsDown = false;


    /*
        Player dragged the mouse while
        holding the button.

        IGNORE IT COMPLETELY.

        No waypoint.
        No permanent line.
        No distance added.
    */

    if (mouseDragged) {

        mouseDragged = false;
        mouseDownPoint = null;

        return;
    }


    mouseDownPoint = null;


    /*
        This was a genuine click.

        Delay very slightly so double-click
        can still be used to finish a route.
    */

    clearTimeout(
        clickTimer
    );


    const clickedPoint =
        event.latlng;


    clickTimer =
        setTimeout(function () {

            if (!currentRoute) {

                startRoute(
                    clickedPoint
                );

            } else {

                addWaypoint(
                    clickedPoint
                );
            }

        }, 220);
});

    
// ======================================
// ESCAPE
// ======================================

document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key !== "Escape" ||
            mode !== "measure"
        ) {
            return;
        }


        // First Escape finishes current route.
        if (currentRoute) {

            finishRoute();

            return;
        }


        // Escape again exits measure mode.
        mode = "none";

        map.getContainer().classList.remove("measure-mode");

        map.dragging.enable();

        measureButton.innerText =
            "Measure";

        statusText.innerText =
            "Measure tool closed. Existing routes remain.";
    }
);

    #map.measure-mode,
        
#map.measure-mode .leaflet-map-pane,
        
#map.measure-mode .leaflet-map-pane * {
    
    cursor: crosshair !important;
}
</script>

</body>
</html>
