<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>D&D World Map</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: #111;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        #toolbar {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;

            background: rgba(20, 20, 20, 0.92);
            color: white;

            padding: 10px;
            border-radius: 8px;

            display: flex;
            gap: 8px;
            align-items: center;

            box-shadow: 0 2px 8px rgba(0,0,0,.5);
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }

        #status {
            min-width: 220px;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            #toolbar {
                width: 90%;
                flex-wrap: wrap;
                justify-content: center;
            }

            #status {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div id="toolbar">
    <button id="calibrateButton">Calibrate 50 Miles</button>
    <button id="measureButton">Measure</button>
    <button id="clearButton">Clear</button>

    <span id="status">Loading ...</span>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const IMAGE_URL = "Map.jpg";
const CALIBRATION_MILES = 50;

const map = L.map("map", {
    crs: L.CRS.Simple,
    minZoom: -5,
    zoomSnap: 0.25
});

let mode = "none";

let calibrationPoints = [];
let calibrationLayers = [];

let routeLayers = [];
let routePoints = [];

let drawing = false;
let routeLine = null;

let lastRoutePoint = null;
let lastScreenPoint = null;

let lockedMiles = 0;

let liveTooltip = null;

let pixelsPerMile =
    parseFloat(localStorage.getItem("pixelsPerMile")) || null;

const statusText = document.getElementById("status");
const measureButton = document.getElementById("measureButton");

const image = new Image();


// =========================
// LOAD MAP
// =========================

image.onload = function () {

    const width = image.naturalWidth;
    const height = image.naturalHeight;

    const bounds = [
        [0, 0],
        [height, width]
    ];

    L.imageOverlay(
        IMAGE_URL,
        bounds
    ).addTo(map);

    map.fitBounds(bounds);

    map.setMaxBounds([
        [-height * 0.2, -width * 0.2],
        [height * 1.2, width * 1.2]
    ]);

    updateStatus();
};

image.onerror = function () {

    statusText.innerText =
        "Map image could not be loaded.";
};

image.src = IMAGE_URL;


// =========================
// DISTANCE FUNCTIONS
// =========================

function pixelDistance(a, b) {

    const x = b.lng - a.lng;
    const y = b.lat - a.lat;

    return Math.sqrt(
        (x * x) +
        (y * y)
    );
}


function milesBetween(a, b) {

    if (!pixelsPerMile) {
        return 0;
    }

    return pixelDistance(a, b) / pixelsPerMile;
}


// =========================
// ROUTE MANAGEMENT
// =========================

function clearRoute() {

    routeLayers.forEach(layer => {

        if (map.hasLayer(layer)) {
            map.removeLayer(layer);
        }

    });

    routeLayers = [];
    routePoints = [];

    routeLine = null;

    drawing = false;

    lastRoutePoint = null;
    lastScreenPoint = null;

    lockedMiles = 0;

    if (liveTooltip) {

        if (map.hasLayer(liveTooltip)) {
            map.removeLayer(liveTooltip);
        }

        liveTooltip = null;
    }
}


function clearCalibrationMarks() {

    calibrationLayers.forEach(layer => {

        if (map.hasLayer(layer)) {
            map.removeLayer(layer);
        }

    });

    calibrationLayers = [];
    calibrationPoints = [];
}


function updateStatus() {

    if (pixelsPerMile) {

        statusText.innerText =
            "Ready — map calibrated.";

    } else {

        statusText.innerText =
            "Calibrate the map before measuring.";
    }
}


// =========================
// CALIBRATION BUTTON
// =========================

document
.getElementById("calibrateButton")
.addEventListener("click", function () {

    clearRoute();
    clearCalibrationMarks();

    mode = "calibrate";

    map.dragging.enable();

    measureButton.innerText = "Measure";

    statusText.innerText =
        "Click two points exactly 50 miles apart.";
});


// =========================
// MEASURE BUTTON
// =========================

measureButton
.addEventListener("click", function () {

    if (!pixelsPerMile) {

        statusText.innerText =
            "Calibrate the map first.";

        return;
    }


    // EXIT MEASURE MODE
    if (mode === "measure") {

        mode = "none";

        drawing = false;

        map.dragging.enable();

        measureButton.innerText =
            "Measure";

        statusText.innerText =
            "Measurement finished.";

        return;
    }


    // ENTER MEASURE MODE

    clearRoute();
    clearCalibrationMarks();

    mode = "measure";

    /*
        Disable normal map dragging.
        Left mouse drag now becomes the ruler.
    */

    map.dragging.disable();

    measureButton.innerText =
        "Exit Measure";

    statusText.innerText =
        "Hold left mouse button and drag along your route.";
});


// =========================
// CLEAR BUTTON
// =========================

document
.getElementById("clearButton")
.addEventListener("click", function () {

    clearRoute();
    clearCalibrationMarks();

    mode = "none";

    map.dragging.enable();

    measureButton.innerText =
        "Measure";

    updateStatus();
});


// =========================
// CALIBRATION CLICKS
// =========================

map.on("click", function (event) {

    if (mode !== "calibrate") {
        return;
    }

    const point = event.latlng;

    calibrationPoints.push(point);

    const marker = L.circleMarker(
        point,
        {
            radius: 6,
            weight: 2,
            fillOpacity: 1
        }
    ).addTo(map);

    calibrationLayers.push(marker);


    if (calibrationPoints.length === 2) {

        const line = L.polyline(
            calibrationPoints,
            {
                weight: 3
            }
        ).addTo(map);

        calibrationLayers.push(line);


        const pixels = pixelDistance(
            calibrationPoints[0],
            calibrationPoints[1]
        );

        pixelsPerMile =
            pixels / CALIBRATION_MILES;


        localStorage.setItem(
            "pixelsPerMile",
            pixelsPerMile
        );


        statusText.innerText =
            "Calibration saved — that distance is 50 miles.";

        mode = "none";
    }
});


// =========================
// BEGIN DRAWING
// =========================

map.on("mousedown", function (event) {

    if (mode !== "measure") {
        return;
    }


    if (
        event.originalEvent &&
        event.originalEvent.button !== 0
    ) {
        return;
    }


    /*
        Starting another drag begins
        a new measurement.
    */

    clearRoute();


    drawing = true;

    const point = event.latlng;

    routePoints.push(point);

    lastRoutePoint = point;

    lastScreenPoint =
        map.latLngToContainerPoint(point);


    routeLine = L.polyline(
        [point],
        {
            weight: 4,
            lineCap: "round",
            lineJoin: "round"
        }
    ).addTo(map);

    routeLayers.push(routeLine);


    const startMarker = L.circleMarker(
        point,
        {
            radius: 5,
            weight: 2,
            fillOpacity: 1
        }
    ).addTo(map);

    routeLayers.push(startMarker);


    liveTooltip = L.tooltip({
        direction: "top",
        offset: [0, -12],
        opacity: 0.95
    })
    .setLatLng(point)
    .setContent("<b>0.0 miles</b>")
    .addTo(map);


    statusText.innerText =
        "Distance: 0.0 miles";
});


// =========================
// DRAW WHILE DRAGGING
// =========================

map.on("mousemove", function (event) {

    if (
        mode !== "measure" ||
        !drawing
    ) {
        return;
    }


    const point = event.latlng;

    const screenPoint =
        map.latLngToContainerPoint(point);


    /*
        Only permanently record another point
        after the mouse has moved a few screen
        pixels.

        This keeps the path smooth without
        creating thousands of unnecessary points.
    */

    const screenDistance =
        lastScreenPoint.distanceTo(screenPoint);


    let previewMiles =
        lockedMiles +
        milesBetween(
            lastRoutePoint,
            point
        );


    if (screenDistance >= 3) {

        lockedMiles +=
            milesBetween(
                lastRoutePoint,
                point
            );


        routePoints.push(point);

        lastRoutePoint = point;
        lastScreenPoint = screenPoint;

        previewMiles = lockedMiles;
    }


    /*
        Add the current cursor location
        temporarily so the line follows
        your mouse perfectly.
    */

    routeLine.setLatLngs(
        routePoints.concat([point])
    );


    liveTooltip
        .setLatLng(point)
        .setContent(
            "<b>" +
            previewMiles.toFixed(1) +
            " miles</b>"
        );


    statusText.innerText =
        "Distance: " +
        previewMiles.toFixed(1) +
        " miles";
});


// =========================
// FINISH DRAWING
// =========================

map.on("mouseup", function (event) {

    if (
        mode !== "measure" ||
        !drawing
    ) {
        return;
    }


    const point = event.latlng;


    lockedMiles +=
        milesBetween(
            lastRoutePoint,
            point
        );


    routePoints.push(point);

    routeLine.setLatLngs(routePoints);


    drawing = false;


    if (liveTooltip) {

        map.removeLayer(liveTooltip);

        liveTooltip = null;
    }


    const endMarker = L.circleMarker(
        point,
        {
            radius: 5,
            weight: 2,
            fillOpacity: 1
        }
    ).addTo(map);

    routeLayers.push(endMarker);


    const finalLabel = L.tooltip({
        permanent: true,
        direction: "top",
        offset: [0, -10],
        className: "final-distance-label"
    })
    .setLatLng(point)
    .setContent(
        "<b>" +
        lockedMiles.toFixed(1) +
        " miles</b>"
    )
    .addTo(map);

    routeLayers.push(finalLabel);


    statusText.innerText =
        "Total Distance: " +
        lockedMiles.toFixed(1) +
        " miles";
});


// =========================
// ESCAPE KEY
// =========================

document.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Escape") {

            drawing = false;

            mode = "none";

            map.dragging.enable();

            measureButton.innerText =
                "Measure";

            if (liveTooltip) {

                map.removeLayer(liveTooltip);
                liveTooltip = null;
            }

            statusText.innerText =
                "Measurement finished.";
        }
    }
);

</script>

</body>
</html>
