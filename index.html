<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>D&D World Map</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: #111;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        #toolbar {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;

            background: rgba(20, 20, 20, 0.92);
            color: white;

            padding: 10px;
            border-radius: 8px;

            display: flex;
            gap: 8px;
            align-items: center;

            box-shadow: 0 2px 8px rgba(0,0,0,.5);
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }

        #status {
            min-width: 220px;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            #toolbar {
                width: 90%;
                flex-wrap: wrap;
                justify-content: center;
            }

            #status {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div id="toolbar">
    <button id="calibrateButton">Calibrate 50 Miles</button>
    <button id="measureButton">Measure</button>
    <button id="clearButton">Clear</button>

    <span id="status">Loading ...</span>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const IMAGE_URL = "Map.jpg";
const CALIBRATION_MILES = 50;

const map = L.map("map", {
    crs: L.CRS.Simple,
    minZoom: -5,
    zoomSnap: 0.25
});

let mode = "none";

let calibrationPoints = [];
let measurementPoints = [];

let mapLayers = [];

let previewLine = null;
let liveTooltip = null;

let pixelsPerMile =
    parseFloat(localStorage.getItem("pixelsPerMile")) || null;

const statusText = document.getElementById("status");

const image = new Image();

image.onload = function () {

    const width = image.naturalWidth;
    const height = image.naturalHeight;

    const bounds = [
        [0, 0],
        [height, width]
    ];

    L.imageOverlay(IMAGE_URL, bounds).addTo(map);

    map.fitBounds(bounds);

    map.setMaxBounds([
        [-height * 0.2, -width * 0.2],
        [height * 1.2, width * 1.2]
    ]);

    updateStatus();
};

image.onerror = function () {
    statusText.innerText = "Map image could not be loaded.";
};

image.src = IMAGE_URL;


function pixelDistance(pointA, pointB) {

    const x = pointB.lng - pointA.lng;
    const y = pointB.lat - pointA.lat;

    return Math.sqrt((x * x) + (y * y));
}


function milesBetween(pointA, pointB) {

    return pixelDistance(pointA, pointB) / pixelsPerMile;
}


function getTotalMiles(extraPoint = null) {

    let total = 0;

    for (let i = 1; i < measurementPoints.length; i++) {

        total += milesBetween(
            measurementPoints[i - 1],
            measurementPoints[i]
        );
    }

    if (
        extraPoint &&
        measurementPoints.length > 0
    ) {

        total += milesBetween(
            measurementPoints[
                measurementPoints.length - 1
            ],
            extraPoint
        );
    }

    return total;
}


function addPoint(point) {

    const marker = L.circleMarker(point, {
        radius: 5,
        weight: 2,
        fillOpacity: 1
    }).addTo(map);

    mapLayers.push(marker);

    return marker;
}


function addSegment(pointA, pointB) {

    const miles = milesBetween(pointA, pointB);

    const line = L.polyline(
        [pointA, pointB],
        {
            weight: 3
        }
    ).addTo(map);

    mapLayers.push(line);

    const midpoint = L.latLng(
        (pointA.lat + pointB.lat) / 2,
        (pointA.lng + pointB.lng) / 2
    );

    const label = L.tooltip({
        permanent: true,
        direction: "center",
        className: "distance-label"
    })
    .setLatLng(midpoint)
    .setContent(miles.toFixed(1) + " mi")
    .addTo(map);

    mapLayers.push(label);
}


function removePreview() {

    if (previewLine) {
        map.removeLayer(previewLine);
        previewLine = null;
    }

    if (liveTooltip) {
        map.removeLayer(liveTooltip);
        liveTooltip = null;
    }
}


function clearMeasurement() {

    removePreview();

    mapLayers.forEach(layer => {
        map.removeLayer(layer);
    });

    mapLayers = [];

    measurementPoints = [];
    calibrationPoints = [];
}


function updateStatus() {

    if (pixelsPerMile) {

        statusText.innerText =
            "Ready — map calibrated.";

    } else {

        statusText.innerText =
            "Calibrate the map before measuring.";
    }
}


document
.getElementById("calibrateButton")
.addEventListener("click", function () {

    clearMeasurement();

    mode = "calibrate";

    statusText.innerText =
        "Click two points exactly 50 miles apart.";
});


document
.getElementById("measureButton")
.addEventListener("click", function () {

    if (!pixelsPerMile) {

        statusText.innerText =
            "Calibrate the map first.";

        return;
    }

    clearMeasurement();

    mode = "measure";

    statusText.innerText =
        "Click your starting point.";
});


document
.getElementById("clearButton")
.addEventListener("click", function () {

    clearMeasurement();

    mode = "none";

    updateStatus();
});


map.on("click", function (event) {

    const point = event.latlng;


    if (mode === "calibrate") {

        calibrationPoints.push(point);

        addPoint(point);

        if (calibrationPoints.length === 2) {

            const line = L.polyline(
                calibrationPoints,
                {
                    weight: 3
                }
            ).addTo(map);

            mapLayers.push(line);

            const pixels = pixelDistance(
                calibrationPoints[0],
                calibrationPoints[1]
            );

            pixelsPerMile =
                pixels / CALIBRATION_MILES;

            localStorage.setItem(
                "pixelsPerMile",
                pixelsPerMile
            );

            statusText.innerText =
                "Calibration saved — 50 miles.";

            mode = "none";
        }

        return;
    }


    if (mode === "measure") {

        removePreview();

        if (measurementPoints.length === 0) {

            measurementPoints.push(point);

            addPoint(point);

            statusText.innerText =
                "Starting point placed — move mouse to measure.";

            return;
        }


        const previousPoint =
            measurementPoints[
                measurementPoints.length - 1
            ];

        measurementPoints.push(point);

        addPoint(point);

        addSegment(previousPoint, point);

        const totalMiles = getTotalMiles();

        statusText.innerText =
            "Total: " +
            totalMiles.toFixed(1) +
            " miles";
    }
});


map.on("mousemove", function (event) {

    if (
        mode !== "measure" ||
        measurementPoints.length === 0
    ) {
        return;
    }

    removePreview();

    const previousPoint =
        measurementPoints[
            measurementPoints.length - 1
        ];

    const currentPoint = event.latlng;

    previewLine = L.polyline(
        [previousPoint, currentPoint],
        {
            weight: 2,
            dashArray: "6, 6"
        }
    ).addTo(map);


    const segmentMiles =
        milesBetween(
            previousPoint,
            currentPoint
        );

    const totalMiles =
        getTotalMiles(currentPoint);


    liveTooltip = L.tooltip({
        direction: "top",
        offset: [0, -10]
    })
    .setLatLng(currentPoint)
    .setContent(
        "<b>" +
        segmentMiles.toFixed(1) +
        " mi</b><br>" +
        "Total: " +
        totalMiles.toFixed(1) +
        " mi"
    )
    .addTo(map);


    statusText.innerText =
        "Segment: " +
        segmentMiles.toFixed(1) +
        " mi | Total: " +
        totalMiles.toFixed(1) +
        " mi";
});

</script>

</body>
</html>
