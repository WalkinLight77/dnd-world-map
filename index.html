<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>D&D World Map</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: #111;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        #toolbar {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;

            background: rgba(20, 20, 20, 0.92);
            color: white;

            padding: 10px;
            border-radius: 8px;

            display: flex;
            gap: 8px;
            align-items: center;

            box-shadow: 0 2px 8px rgba(0,0,0,.5);
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }

        #status {
            min-width: 220px;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            #toolbar {
                width: 90%;
                flex-wrap: wrap;
                justify-content: center;
            }

            #status {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div id="toolbar">
    <button id="calibrateButton">Calibrate 50 Miles</button>
    <button id="measureButton">Measure</button>
    <button id="clearButton">Clear</button>

    <span id="status">Loading ...</span>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const IMAGE_URL = "Map.jpg";
const CALIBRATION_MILES = 50;

const map = L.map("map", {
    crs: L.CRS.Simple,
    minZoom: -5,
    zoomSnap: 0.25,
    doubleClickZoom: false
});

let mode = "none";

let calibrationPoints = [];
let calibrationLayers = [];

/*
    ALL paths ever drawn.
    These remain until Clear is pressed.
*/
let allRouteLayers = [];

/*
    The path currently being worked on.
*/
let currentPath = null;

let drawing = false;
let lastRecordedPoint = null;
let lastScreenPoint = null;

let liveTooltip = null;

let pixelsPerMile =
    parseFloat(localStorage.getItem("pixelsPerMile")) || null;

const statusText =
    document.getElementById("status");

const measureButton =
    document.getElementById("measureButton");

const image = new Image();


// ========================================
// LOAD MAP
// ========================================

image.onload = function () {

    const width = image.naturalWidth;
    const height = image.naturalHeight;

    const bounds = [
        [0, 0],
        [height, width]
    ];

    L.imageOverlay(
        IMAGE_URL,
        bounds
    ).addTo(map);

    map.fitBounds(bounds);

    map.setMaxBounds([
        [-height * 0.2, -width * 0.2],
        [height * 1.2, width * 1.2]
    ]);

    updateStatus();
};

image.onerror = function () {

    statusText.innerText =
        "Map image could not be loaded.";
};

image.src = IMAGE_URL;


// ========================================
// DISTANCE
// ========================================

function pixelDistance(a, b) {

    const x = b.lng - a.lng;
    const y = b.lat - a.lat;

    return Math.sqrt(
        (x * x) +
        (y * y)
    );
}


function milesBetween(a, b) {

    if (!pixelsPerMile) {
        return 0;
    }

    return pixelDistance(a, b) / pixelsPerMile;
}


// ========================================
// STATUS
// ========================================

function updateStatus() {

    if (pixelsPerMile) {

        statusText.innerText =
            "Ready — map calibrated.";

    } else {

        statusText.innerText =
            "Calibrate the map before measuring.";
    }
}


// ========================================
// CALIBRATION
// ========================================

function clearCalibrationMarks() {

    calibrationLayers.forEach(layer => {

        if (map.hasLayer(layer)) {
            map.removeLayer(layer);
        }

    });

    calibrationLayers = [];
    calibrationPoints = [];
}


document
.getElementById("calibrateButton")
.addEventListener("click", function () {

    finishCurrentPath();

    clearCalibrationMarks();

    mode = "calibrate";

    map.dragging.enable();

    measureButton.innerText =
        "Measure";

    statusText.innerText =
        "Click two points exactly 50 miles apart.";
});


map.on("click", function (event) {

    if (mode !== "calibrate") {
        return;
    }

    const point = event.latlng;

    calibrationPoints.push(point);

    const marker =
        L.circleMarker(point, {
            radius: 6,
            weight: 2,
            fillOpacity: 1
        })
        .addTo(map);

    calibrationLayers.push(marker);


    if (calibrationPoints.length === 2) {

        const line =
            L.polyline(
                calibrationPoints,
                {
                    weight: 3
                }
            )
            .addTo(map);

        calibrationLayers.push(line);


        const pixels =
            pixelDistance(
                calibrationPoints[0],
                calibrationPoints[1]
            );


        pixelsPerMile =
            pixels / CALIBRATION_MILES;


        localStorage.setItem(
            "pixelsPerMile",
            pixelsPerMile
        );


        statusText.innerText =
            "Calibration saved — 50 miles.";

        mode = "none";
    }
});


// ========================================
// CREATE NEW PATH
// ========================================

function createNewPath(startPoint) {

    const line =
        L.polyline(
            [startPoint],
            {
                weight: 4,
                color: "#ff2b2b",
                dashArray: "3, 6",
                lineCap: "round",
                lineJoin: "round"
            }
        )
        .addTo(map);


    const startMarker =
        L.circleMarker(
            startPoint,
            {
                radius: 5,
                weight: 2,
                color: "#ff2b2b",
                fillColor: "#ff2b2b",
                fillOpacity: 1
            }
        )
        .addTo(map);


    allRouteLayers.push(line);
    allRouteLayers.push(startMarker);


    currentPath = {

        points: [startPoint],

        line: line,

        totalMiles: 0,

        lastPoint: startPoint
    };


    lastRecordedPoint =
        startPoint;


    lastScreenPoint =
        map.latLngToContainerPoint(
            startPoint
        );
}


// ========================================
// ADD CUMULATIVE LABEL
// ========================================

function addDistanceLabel(point, miles) {

    const label =
        L.tooltip({
            permanent: true,
            direction: "top",
            offset: [0, -10],
            className: "distance-label"
        })
        .setLatLng(point)
        .setContent(
            Math.round(miles) +
            " miles"
        )
        .addTo(map);


    allRouteLayers.push(label);
}


// ========================================
// FINISH CURRENT PATH
// ========================================

function finishCurrentPath() {

    drawing = false;

    if (liveTooltip) {

        if (map.hasLayer(liveTooltip)) {
            map.removeLayer(liveTooltip);
        }

        liveTooltip = null;
    }


    if (currentPath) {

        currentPath = null;

        lastRecordedPoint = null;
        lastScreenPoint = null;
    }
}


// ========================================
// CLEAR EVERYTHING
// ========================================

function clearAllRoutes() {

    finishCurrentPath();


    allRouteLayers.forEach(layer => {

        if (map.hasLayer(layer)) {
            map.removeLayer(layer);
        }

    });


    allRouteLayers = [];
}


// ========================================
// MEASURE BUTTON
// ========================================

measureButton
.addEventListener("click", function () {

    if (!pixelsPerMile) {

        statusText.innerText =
            "Calibrate the map first.";

        return;
    }


    /*
        EXIT MEASURE MODE
    */

    if (mode === "measure") {

        finishCurrentPath();

        mode = "none";

        map.dragging.enable();

        measureButton.innerText =
            "Measure";

        statusText.innerText =
            "Measurement saved.";

        return;
    }


    /*
        ENTER MEASURE MODE

        IMPORTANT:
        We do NOT clear previous paths.
    */

    clearCalibrationMarks();

    finishCurrentPath();

    mode = "measure";

    map.dragging.disable();

    measureButton.innerText =
        "Exit Measure";

    statusText.innerText =
        "Drag to begin a new path.";
});


// ========================================
// CLEAR BUTTON
// ========================================

document
.getElementById("clearButton")
.addEventListener("click", function () {

    clearAllRoutes();
    clearCalibrationMarks();

    mode = "none";

    map.dragging.enable();

    measureButton.innerText =
        "Measure";

    updateStatus();
});


// ========================================
// BEGIN / CONTINUE DRAGGING
// ========================================

map.on("mousedown", function (event) {

    if (mode !== "measure") {
        return;
    }


    if (
        event.originalEvent &&
        event.originalEvent.button !== 0
    ) {
        return;
    }


    const mousePoint =
        event.latlng;


    /*
        No active journey yet.

        Start a completely new path.
    */

    if (!currentPath) {

        createNewPath(mousePoint);

    } else {

        /*
            A journey already exists.

            Continue from its LAST endpoint.

            This is what makes:

            246
              ↓
            492
              ↓
            716

            instead of resetting.
        */

        lastRecordedPoint =
            currentPath.lastPoint;


        lastScreenPoint =
            map.latLngToContainerPoint(
                lastRecordedPoint
            );
    }


    drawing = true;


    if (liveTooltip) {

        map.removeLayer(
            liveTooltip
        );
    }


    liveTooltip =
        L.tooltip({
            direction: "top",
            offset: [0, -12],
            opacity: 0.95
        })
        .setLatLng(
            currentPath.lastPoint
        )
        .setContent(
            "<b>" +
            currentPath.totalMiles.toFixed(1) +
            " miles</b>"
        )
        .addTo(map);
});


// ========================================
// DRAW WHILE HOLDING MOUSE
// ========================================

map.on("mousemove", function (event) {

    if (
        mode !== "measure" ||
        !drawing ||
        !currentPath
    ) {
        return;
    }


    const point =
        event.latlng;


    const screenPoint =
        map.latLngToContainerPoint(
            point
        );


    const screenDistance =
        lastScreenPoint.distanceTo(
            screenPoint
        );


    /*
        Preview distance from the most
        recently recorded location.
    */

    let displayedMiles =
        currentPath.totalMiles +
        milesBetween(
            lastRecordedPoint,
            point
        );


    /*
        Permanently record a new route point
        every few pixels.
    */

    if (screenDistance >= 3) {

        const addedMiles =
            milesBetween(
                lastRecordedPoint,
                point
            );


        currentPath.totalMiles +=
            addedMiles;


        currentPath.points.push(
            point
        );


        currentPath.lastPoint =
            point;


        lastRecordedPoint =
            point;


        lastScreenPoint =
            screenPoint;


        displayedMiles =
            currentPath.totalMiles;
    }


    /*
        Add cursor as temporary endpoint
        so the line follows smoothly.
    */

    currentPath.line.setLatLngs(
        currentPath.points.concat(
            [point]
        )
    );


    liveTooltip
        .setLatLng(point)
        .setContent(
            "<b>" +
            displayedMiles.toFixed(1) +
            " miles</b>"
        );


    statusText.innerText =
        "Total Distance: " +
        displayedMiles.toFixed(1) +
        " miles";
});


// ========================================
// RELEASE MOUSE — FINISH SEGMENT
// BUT NOT THE WHOLE JOURNEY
// ========================================

map.on("mouseup", function (event) {

    if (
        mode !== "measure" ||
        !drawing ||
        !currentPath
    ) {
        return;
    }


    const point =
        event.latlng;


    const extraMiles =
        milesBetween(
            lastRecordedPoint,
            point
        );


    currentPath.totalMiles +=
        extraMiles;


    currentPath.points.push(
        point
    );


    currentPath.lastPoint =
        point;


    currentPath.line.setLatLngs(
        currentPath.points
    );


    drawing = false;


    if (liveTooltip) {

        map.removeLayer(
            liveTooltip
        );

        liveTooltip = null;
    }


    /*
        Put a marker at this waypoint.
    */

    const marker =
        L.circleMarker(
            point,
            {
                radius: 4,
                weight: 2,
                color: "#ff2b2b",
                fillColor: "#ff2b2b",
                fillOpacity: 1
            }
        )
        .addTo(map);


    allRouteLayers.push(marker);


    /*
        IMPORTANT:

        Label is the ENTIRE journey distance,
        NOT just this individual segment.
    */

    addDistanceLabel(
        point,
        currentPath.totalMiles
    );


    statusText.innerText =
        "Total: " +
        currentPath.totalMiles.toFixed(1) +
        " miles — drag again to continue.";
});


// ========================================
// KEYBOARD CONTROLS
// ========================================

document.addEventListener(
    "keydown",
    function (event) {

        if (event.key !== "Escape") {
            return;
        }


        if (mode !== "measure") {
            return;
        }


        /*
            ESC while a path exists:

            Finish THIS journey,
            but remain in Measure mode.

            Next drag creates another path.
        */

        if (currentPath) {

            finishCurrentPath();

            statusText.innerText =
                "Path finished — drag somewhere else to begin another.";

            return;
        }


        /*
            ESC again:

            Exit measuring entirely.
            Previous routes remain.
        */

        mode = "none";

        map.dragging.enable();

        measureButton.innerText =
            "Measure";

        statusText.innerText =
            "Measurement tool closed.";
    }
);

</script>

</body>
</html>
